[project]
name = "celery-healthcheck"
version = "0.3.0"
description = "A lightweight HTTP health check server for Celery workers, designed to work with cloud platforms that only support TCP-based health probes"
keywords = [
    "celery",
    "health-check",
    "healthcheck",
    "monitoring",
    "azure",
    "fastapi",
    "worker",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["celery>=5.5.0", "fastapi>=0.115.12", "uvicorn>=0.34.0"]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/celery-healthcheck" }
license = { text = "MIT" }

[build-system]
requires = ["uv_build>=0.11.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "celery-types",
    "covdefaults>=2.3.0",
    "coverage>=7.13.4",
    "httpx>=0.28.1",
    "pyright[nodejs]>=1.1.408",
    "pytest-cov>=7.0.0",
    "pytest>=8.3.4",
    "ruff>=0.15.0",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["celery_healthcheck"]

[tool.coverage.report]
fail_under = 50
